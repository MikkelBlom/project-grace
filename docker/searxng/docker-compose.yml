services:
  searxng:
    image: searxng/searxng:latest
    container_name: grace-searxng
    restart: unless-stopped
    ports:
      - "8888:8080"
    volumes:
      - ./config:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
      # Local, single-user instance — the rate limiter/bot-detection just gets in Grace's way.
      - SEARXNG_LIMITER=false
